<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Moodify</title>

        <link rel="stylesheet" href="/styles.css" />
    </head>

    <body>

        <main>

            <h1>🎵 Moodify</h1>

            <p class="subtitle">
                Discover the perfect playlist based on your mood.
            </p>

            <div class="mood-grid">

                <button class="mood-card">😊 <span>Happy</span></button>
                <button class="mood-card">😌 <span>Calm</span></button>
                <button class="mood-card">💪 <span>Energetic</span></button>
                <button class="mood-card">😴 <span>Tired</span></button>
                <button class="mood-card">😢 <span>Sad</span></button>
                <button class="mood-card">❤️ <span>Romantic</span></button>

            </div>

            <button class="recommend-btn">
                Get Recommendation
            </button>

            <div class="result">

                <h2>Your Recommendation</h2>

                <p><strong>Playlist:</strong> --</p>
                <p><strong>Activity:</strong> --</p>
                <p><strong>Message:</strong> --</p>

            </div>

        </main>

        <script src="/script.js"></script>

    </body>

</html>
